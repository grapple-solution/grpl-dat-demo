stage: prd
env: {}
db:
  dbClusterName: dat-demo-db
redis:
  clusterName: dat-demo
strapi:
  enabled: false
gras-deploy:
  enabled: false
grases:
  gras:
    enabled: true
    gras: {}
    grapi:
      name: dat-demo
      runimages:
        image: grpl/loopback
        tag: "0.4.32.pr-482"
      discoveredrepos: true
      ingress: true
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 3
      extraSecrets:
        - dat-demo-db-mysql-account-root
      env:
        - name: RestDefaultLimit
          value: "1000"
        - name: host
          value: "dat-demo-db-mysql"
        - name: port
          value: "3306"
        - name: database
          value: "dsearchtree"
      datasources:
        - name: dsearchtree
          spec:
            mysql:
              database: $(database)
              host: $(host)
              name: dsearchtree
              password: $(password)
              port: $(port)
              url: ""
              user: $(username)
      discoveries:
        - name: dsearchtree
          spec:
            all: true
            dataSource: dsearchtree
            disableCamelCase: false
            schema: $(database)
      restcruds:
        - name: dsearchtree
          spec:
            datasource: dsearchtree
      fuzzysearch:
        - name: datecode2
          content: 'dsearchtree:{"fuzzy":true,"centralFuzzy":false,"datasource":"dsearchtree","databaseName":"dsearchtree","appName":"Grpl","include":"datecode2","subPath":""}'
      # grapi serves GET /drilldowns/<name> (the description) and one searchable,
      # bounded endpoint per level, GET /drilldowns/<name>/<level>, which the gruim
      # modules read. Every level reads its own `model`: `keyColumn` is the value
      # passed down, `displayColumn` the text shown, and each of `parents` names a
      # level above and the column of THIS level's model that holds its key.
      # The result table under the dropdowns is the model of the bottom (last)
      # level: it is filtered on its own keyColumn and on the column it declares
      # in `parents` for each level above. The same as DrilldownConfig in
      # docker-compose.yaml.
      drilldownconfigs:
        # FZA -> HST -> OTG -> HT -> UT, all on the one wide datecode2 table, so
        # every parent is matched against the column of the same name
        - name: vehicle
          spec:
            levels:
              - name: fza
                model: Datecode2
                keyColumn: fza
                displayColumn: fzab
                title: Vehicle type (FZA)
                multiselect: {enable: true}
              - name: hst
                model: Datecode2
                keyColumn: hst
                displayColumn: hstb
                title: Manufacturer (HST)
                multiselect: {enable: true}
                parents:
                  - {level: fza, column: fza}
              - name: otg
                model: Datecode2
                keyColumn: otg
                displayColumn: otgb
                title: Model range (OTG)
                multiselect: {enable: true}
                parents:
                  - {level: fza, column: fza}
                  - {level: hst, column: hst}
              - name: ht
                model: Datecode2
                keyColumn: ht
                displayColumn: htb
                title: Model group (HT)
                multiselect: {enable: true}
                parents:
                  - {level: fza, column: fza}
                  - {level: hst, column: hst}
                  - {level: otg, column: otg}
              - name: ut
                model: Datecode2
                keyColumn: ut
                displayColumn: utb
                title: Model (UT)
                multiselect: {enable: true}
                parents:
                  - {level: fza, column: fza}
                  - {level: hst, column: hst}
                  - {level: otg, column: otg}
                  - {level: ht, column: ht}
        # Country -> City -> Dealer, one table per level (seeded from data/dealers.sql);
        # discovery turns country_id / city_id into the properties countryId / cityId
        # A dealer names its country too: online dealers have no city, and only so
        # does choosing a country and then City "None" still narrow them to it.
        # Dealer is the bottom level, so the result table is Dealer, filtered by
        # country on countryId, by city on cityId and by dealer on id.
        - name: dealers
          spec:
            levels:
              - {name: country, model: Country, keyColumn: id, displayColumn: name, title: Country, multiselect: {enable: true}}
              - {name: city, model: City, keyColumn: id, displayColumn: name, title: City, parents: [{level: country, column: countryId}], multiselect: {enable: true}}
              - {name: dealer, model: Dealer, keyColumn: id, displayColumn: name, title: Dealer, parents: [{level: city, column: cityId}, {level: country, column: countryId}], multiselect: {enable: true}}
      models: []
      repositories: []
      relations: []
      openapis: []
      cacheconfigs: []
      controllers: []
      postpatches: []
      services: []
      serviceproviders: []
      prerelationpatches: []
      prepatches: []
      prediscoverypatches: []
      initContainers:
        - name: init-db
          spec:
            name: init-db
            image: grpl/grpl-dat-demo-data:0.1.0.dev
            imagePullPolicy: Always
            env:
              - name: host
                value: "dat-demo-db-mysql"
              - name: port
                value: "3306"
              - name: username
                valueFrom:
                  secretKeyRef:
                    name: dat-demo-db-mysql-account-root
                    key: username
              - name: password
                valueFrom:
                  secretKeyRef:
                    name: dat-demo-db-mysql-account-root
                    key: password
            command:
              - sh
              - -c
              - |
                set -e
                until mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -e "select 1" >/dev/null 2>&1; do
                  echo "waiting for mysql"
                  sleep 2
                done
                mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -e "CREATE DATABASE IF NOT EXISTS dsearchtree;"
                if mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -N -B -e "select count(*) from dsearchtree.datecode2" > /tmp/datecode2-count 2>/dev/null; then
                  read -r loaded < /tmp/datecode2-count
                else
                  loaded=0
                fi
                if [ "$loaded" = "0" ]; then
                  echo "seeding dsearchtree.datecode2"
                  gzip -dc /seed/datecode2.sql.gz | mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" dsearchtree
                fi
                # the dealers drilldown tables; only into an empty or missing dealer table,
                # so a database someone filled differently is left alone
                if mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -N -B -e "select count(*) from dsearchtree.dealer" > /tmp/dealer-count 2>/dev/null; then
                  read -r dealers < /tmp/dealer-count
                else
                  dealers=0
                fi
                if [ "$dealers" = "0" ]; then
                  echo "seeding dsearchtree.country, city and dealer"
                  mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" --default-character-set=utf8mb4 dsearchtree < /seed/dealers.sql
                fi
                # databases seeded before the dealer table carried the city and country
                # names get the two columns; filling them is cheap, so it runs every start
                mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -N -B -e "select count(*) from information_schema.columns where table_schema='dsearchtree' and table_name='dealer' and column_name='city_name'" > /tmp/dealer-names 2>/dev/null || echo 1 > /tmp/dealer-names
                read -r has_names < /tmp/dealer-names
                if [ "$has_names" = "0" ]; then
                  echo "adding city_name and country_name to dsearchtree.dealer"
                  mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -e "alter table dsearchtree.dealer add column city_name varchar(128) null, add column country_name varchar(128) null"
                fi
                mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" --default-character-set=utf8mb4 -e "update dsearchtree.dealer d left join dsearchtree.city c on c.id = d.city_id left join dsearchtree.country co on co.id = d.country_id set d.city_name = c.name, d.country_name = co.name"
                ensure_index() {
                  index_name="$1"
                  columns="$2"
                  mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -N -B -e "select count(*) from information_schema.statistics where table_schema='dsearchtree' and table_name='datecode2' and index_name='${index_name}'" > /tmp/index-count
                  read -r exists < /tmp/index-count
                  if [ "$exists" = "0" ]; then
                    mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -e "create index ${index_name} on dsearchtree.datecode2 (${columns})"
                  fi
                }
                ensure_index idx_datecode2_fza 'FZA, FZAB'
                ensure_index idx_datecode2_hstb 'HSTB, HST'
                ensure_index idx_datecode2_hst 'HST'
                ensure_index idx_datecode2_otgb 'OTGB, OTG'
                ensure_index idx_datecode2_otg 'OTG'
                ensure_index idx_datecode2_htb 'HTB, HT'
                ensure_index idx_datecode2_ht 'HT'
                ensure_index idx_datecode2_utb 'UTB, UT'
                ensure_index idx_datecode2_ut 'UT'
                # drilldown levels: parents first, then label and code, so a page is
                # read in order straight from the index instead of scanning and sorting
                ensure_index idx_dd_hst 'FZA, HSTB, HST'
                ensure_index idx_dd_otg 'FZA, HST, OTGB, OTG'
                ensure_index idx_dd_ht_otg 'FZA, HST, OTG, HTB, HT'
                ensure_index idx_dd_ht 'FZA, HST, HTB, HT'
                ensure_index idx_dd_ut 'FZA, HST, OTG, HT, UTB, UT'
        - name: init-modules
          spec:
            name: init-modules
            image: grpl/grpl-dat-demo-modules:0.1.0.dev
            imagePullPolicy: Always
            command: ["/bin/sh", "-c", "cp -r /modules/gras/. /opt/custom-modules/ && chown -R 1000:1000 /opt/custom-modules || true"]
            volumeMounts:
              - name: custom-modules
                mountPath: /opt/custom-modules
      volumeMounts:
        - name: custom-modules
          mountPath: /opt/custom-modules
      volumes:
        - name: custom-modules
          emptyDir: {}
    gruim:
      name: dat-demo
      runimages:
        image: grpl/gruim
        tag: "0.3.65"
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 3
      style: '{"colors":{"primary":"#1451cb"}}'
      config: '{"global":{"fetch-page-size":500,"max-records":5000}}'
      additionalpackages: ""
      custommodules: []
      prepatches: []
      postpatches: []
  grascache:
    enabled: true
    gras: {}
    grapi:
      name: dat-demo-cache
      runimages:
        image: grpl/loopback
        tag: "0.4.32.pr-482"
      discoveredrepos: false
      ingress: true
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 1
      extraSecrets:
        - dat-layer2-config
        - dat-demo-redis-account-default
      env:
        - name: RestDefaultLimit
          value: "1000"
      initContainers:
        - name: init-redis
          spec:
            name: init-redis
            image: redis:7.2
            command:
              - sh
              - -c
              - |
                until redis-cli -h $(host) -p $(port) -a $(password) PING | grep -q PONG; do
                  echo "cache is not available yet"
                  sleep 2
                done
        - name: wait-for-dat-api
          spec:
            name: wait-for-dat-api
            image: curlimages/curl:8.7.1
            command:
              - sh
              - -c
              - |
                until curl -sf http://gras-grapi:3000/openapi.json >/dev/null; do
                  echo "DAT layer one is not available yet"
                  sleep 5
                done
      datasources:
        - name: redis
          spec:
            kv-redis:
              db: $(db)
              host: $(host)
              name: redis
              password: $(password)
              port: $(port)
              url: ""
      openapis:
        - name: dsearchtree
          spec:
            url: http://gras-grapi:3000/openapi.json
            prefix: dsearchtree
            client: true
      cacheconfigs:
        - name: dsearchtree
          spec:
            openApis: dsearchtree
            redisDS: redis
            cacheTTL: 6000000
      models: []
      repositories: []
      relations: []
      controllers: []
      postpatches: []
      services: []
      serviceproviders: []
      prerelationpatches: []
      prepatches: []
      prediscoverypatches: []
    gruim:
      name: dat-demo-cache
      runimages:
        image: grpl/gruim
        tag: "0.3.65"
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 1
      style: '{"colors":{"primary":"#1451cb"}}'
      # SVELTE_APP_CUSTOM_CONFIG of the cache-layer gruim. `ai-search.vehicle` is the
      # AI search box of the "AI search" tab: the vehicle drilldown, the read-only
      # MCP server `dat-search` (MCP_CONFIGS in templates/dat-config.yaml) and the
      # glossary the model works with. The guidelines are the same text as
      # vehicleAiGuidelines in src/aiSearchConfig.ts (used by the "AI Chat" tab):
      # keep the two in sync. Keep the guidelines on ONE line without backslashes:
      # gruim images before 79bc52a embedded this value unescaped, so \n broke the JSON.
      config: '{"global":{"fetch-page-size":500,"max-records":5000},"ai-search":{"vehicle":{"drilldown":"vehicle","mcp":"dat-search","guidelines":"DAT vehicle catalogue (table datecode2). Labels are German. The vehicle drilldown has five levels, resolved top-down; each level only offers values valid for the levels chosen above it. Levels: - fza, Vehicle type (FZA): Pkw, SUV, Kleintransporter = cars, SUVs and small vans; Kraftrad = motorbikes; Lastkraftwagen = trucks; Omnibus = buses; Transporter = vans. A car query without a vehicle type means Pkw. - hst, Manufacturer (HST): the brand, e.g. Audi, BMW, Mercedes-Benz, Volkswagen, Yamaha. - otg, Model range (OTG): the model line. BMW uses numbers (3 = 3 series, 5 = 5 series); Audi uses names like A3, A4, Q5. Motorbikes (Kraftrad) and buses (Omnibus) have no model range: there the level is empty, skip it. Cars without a model line have None. - ht, Model group (HT): the body style and generation, with the start of production in the label, e.g. Baureihe 3 Coupe (E46)(1999->), A3 Cabriolet (8VE)(04.2016->). Body words in the query belong here: Cabriolet/Cabrio, Coupe, Limousine/Lim. (saloon/sedan), Touring/Kombi/Avant (estate), Sportback, Roadster. - ut, Model / variant (UT): engine and trim name, e.g. 320d, 35 TFSI sport, 116d. How to read a query: - A year (e.g. 2019) chooses the generation: pick the model group whose start date is on or before that year and is the most recent such one; if two generations overlap, keep both candidates and decide by the variant. The year itself is not a filter, so also list it in unapplied. - Engine size (1.4, 2.0 TDI), power (148 hp, 110 kW), fuel (diesel, petrol), gearbox and colour are not levels: never guess a level from them; list them in unapplied. The variant name often contains the engine, e.g. 320d or 35 TFSI, so use the users variant words for the UT search. - Trim words (sport, S line, M Sport, Edition, Business) are part of the variant (UT). - Without model range, no model line means None for OTG. - Prefer leaving a level open over a guess. Examples: - BMW 3 series cars -> FZA Pkw, HST BMW, OTG 3. - E46 coupe 320d -> FZA Pkw, HST BMW, OTG 3, HT Baureihe 3 Coupe (E46), UT 320d. - Audi A3 Cabriolet 2019 35 TFSI sport 148 hp -> FZA Pkw, HST Audi, OTG A3, HT A3 Cabriolet (8VE)(04.2016->), UT 35 TFSI sport; unapplied: 2019, 148 hp. - Yamaha motorbikes -> FZA Kraftrad, HST Yamaha (model range is empty for motorbikes). - Mercedes trucks -> FZA Lastkraftwagen, HST Mercedes-Benz.","prefetchMaxItems":200,"thinkingBudget":512,"maxSteps":10}}}'
      additionalpackages: ""
      custommodules: []
      prepatches: []
      postpatches: []
replicaCount: 1
image:
  repository: grpl/grpl-dat-demo
  pullPolicy: Always
  tag: "0.1.0.dev"
imagetest:
  repository: grpl/grpl-dat-demo-test
  pullPolicy: Always
  tag: "0.1.0.dev"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
lookup:
  enabled: true
  productName: dat-demo
  domain: MYDOMAIN.grpl.io
  sslissuer: MYISSUER
ingress:
  enabled: true
  className: ""
  ssl: true
  annotations: {}
  hosts: []
  tls: []
resources: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
