services:
  dat-api:
    image: grpl/loopback:0.4.31
    command: ["/bin/sh", "-c", "./start.sh"]
    ports:
      - "3333:3000"
    environment:
      host: ${DAT_DB_HOST:?Set DAT_DB_HOST in .env}
      port: ${DAT_DB_PORT:-3306}
      username: ${DAT_DB_USER:?Set DAT_DB_USER in .env}
      password: ${DAT_DB_PASSWORD:?Set DAT_DB_PASSWORD in .env}
      DEV: "true"
      RestDefaultLimit: "1000"
      DiscoveredRepos: "true"
      DataSources: >-
        dsearchtree:{"name":"dsearchtree","connector":"mysql","url":"","host":"$${host}","port":"$${port}","user":"$${username}","password":"$${password}","database":"${DAT_DB_NAME:-dsearchtree}"}
      Discoveries: >-
        dsearchtree:{"dataSource":"dsearchtree","schema":"${DAT_DB_NAME:-dsearchtree}","all":"true","disableCamelCase":false}
      RestCruds: >-
        dsearchtree:{"datasource":"dsearchtree"}
      DrilldownConfig: >-
        vehicle:{"model":"Datecode2","levels":[{"field":"fza","label":"fzab"},{"field":"hst","label":"hstb"},{"field":"otg","label":"otgb"},{"field":"ht","label":"htb"},{"field":"ut","label":"utb","dependsOn":["fza","hst","ht"]}]}|vehicle-search:{"model":"Datecode2","levels":[{"field":"fza","label":"fzab","optional":true},{"field":"hst","label":"hstb","optional":true},{"field":"otg","label":"otgb","optional":true},{"field":"ht","label":"htb","optional":true},{"field":"ut","label":"utb","dependsOn":["fza","hst","ht"],"optional":true}]}
      FuzzySearchConfig: >-
        dsearchtree:{"fuzzy":true,"centralFuzzy":false,"datasource":"dsearchtree","databaseName":"dsearchtree","appName":"Grpl","include":"datecode2","subPath":""}
      LoggingConfigs: >-
        dsearchtree:{"loglevel":"info","httplog":true,"global":true,"group":"logging"}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/ping"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  dat-cache-api:
    image: grpl/loopback:0.4.31
    command: ["/bin/sh", "-c", "./start.sh"]
    ports:
      - "3334:3000"
    environment:
      DEV: "false"
      RestDefaultLimit: "1000"
      DataSources: >-
        redisDS:{"name":"redisDS","connector":"kv-redis","url":"","host":"${DAT_REDIS_HOST:?Set DAT_REDIS_HOST in .env}","port":"${DAT_REDIS_PORT:-6379}","user":"${DAT_REDIS_USER:-default}","password":"${DAT_REDIS_PASSWORD:?Set DAT_REDIS_PASSWORD in .env}","db":"${DAT_REDIS_DB:-0}"}
      OpenApis: >-
        dsearchtree:{"client":true,"prefix":"dsearchtree","url":"http://dat-api:3000/openapi.json"}
      CacheConfigs: >-
        dsearchtree:{"redisDS":"redisDS","cacheTTL":6000000}
      LoggingConfigs: >-
        dsearchtree:{"loglevel":"info","httplog":true,"global":true,"group":"logging"}
      MCP_CONFIGS: '{"enable":true}'
    depends_on:
      dat-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/ping"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    environment:
      SVELTE_APP_API_URL: http://localhost:3334/dsearchtree
    depends_on:
      dat-api:
        condition: service_healthy
