services:
  dat-api:
    image: grpl/loopback:0.4.31.pr-480
    command: ["/bin/sh", "-c", "./start.sh"]
    ports:
      - "3333:3000"
    environment:
      host: ${DAT_DB_HOST:?Set DAT_DB_HOST in .env}
      port: ${DAT_DB_PORT:-3306}
      username: ${DAT_DB_USER:?Set DAT_DB_USER in .env}
      password: ${DAT_DB_PASSWORD:?Set DAT_DB_PASSWORD in .env}
      DEV: "true"
      RestDefaultLimit: "1000"
      DiscoveredRepos: "true"
      DataSources: >-
        dsearchtree:{"name":"dsearchtree","connector":"mysql","url":"","host":"$${host}","port":"$${port}","user":"$${username}","password":"$${password}","database":"${DAT_DB_NAME:-dsearchtree}"}
      Discoveries: >-
        dsearchtree:{"dataSource":"dsearchtree","schema":"${DAT_DB_NAME:-dsearchtree}","all":"true","disableCamelCase":false}
      RestCruds: >-
        dsearchtree:{"datasource":"dsearchtree"}
      # the vehicle and dealers drilldowns, the same as drilldownconfigs in chart/values.yaml
      DrilldownConfig: >-
        vehicle:{"levels":[{"name":"fza","model":"Datecode2","keyColumn":"fza","displayColumn":"fzab","title":"Vehicle type (FZA)","multiselect":{"enable":true}},{"name":"hst","model":"Datecode2","keyColumn":"hst","displayColumn":"hstb","title":"Manufacturer (HST)","multiselect":{"enable":true},"parents":[{"level":"fza","column":"fza"}]},{"name":"otg","model":"Datecode2","keyColumn":"otg","displayColumn":"otgb","title":"Model range (OTG)","multiselect":{"enable":true},"parents":[{"level":"fza","column":"fza"},{"level":"hst","column":"hst"}]},{"name":"ht","model":"Datecode2","keyColumn":"ht","displayColumn":"htb","title":"Model group (HT)","multiselect":{"enable":true},"parents":[{"level":"fza","column":"fza"},{"level":"hst","column":"hst"},{"level":"otg","column":"otg"}]},{"name":"ut","model":"Datecode2","keyColumn":"ut","displayColumn":"utb","title":"Model (UT)","multiselect":{"enable":true},"parents":[{"level":"fza","column":"fza"},{"level":"hst","column":"hst"},{"level":"otg","column":"otg"},{"level":"ht","column":"ht"}]}]}|dealers:{"levels":[{"name":"country","model":"Country","keyColumn":"id","displayColumn":"name","title":"Country","multiselect":{"enable":true}},{"name":"city","model":"City","keyColumn":"id","displayColumn":"name","title":"City","multiselect":{"enable":true},"parents":[{"level":"country","column":"countryId"}]},{"name":"dealer","model":"Dealer","keyColumn":"id","displayColumn":"name","title":"Dealer","multiselect":{"enable":true},"parents":[{"level":"city","column":"cityId"},{"level":"country","column":"countryId"}]}]}
      FuzzySearchConfig: >-
        dsearchtree:{"fuzzy":true,"centralFuzzy":false,"datasource":"dsearchtree","databaseName":"dsearchtree","appName":"Grpl","include":"datecode2","subPath":""}
      LoggingConfigs: >-
        dsearchtree:{"loglevel":"info","httplog":true,"global":true,"group":"logging"}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/ping"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  dat-cache-api:
    image: grpl/loopback:0.4.31.pr-480
    command: ["/bin/sh", "-c", "./start.sh"]
    ports:
      - "3334:3000"
    environment:
      DEV: "false"
      RestDefaultLimit: "1000"
      DataSources: >-
        redisDS:{"name":"redisDS","connector":"kv-redis","url":"","host":"${DAT_REDIS_HOST:?Set DAT_REDIS_HOST in .env}","port":"${DAT_REDIS_PORT:-6379}","user":"${DAT_REDIS_USER:-default}","password":"${DAT_REDIS_PASSWORD:?Set DAT_REDIS_PASSWORD in .env}","db":"${DAT_REDIS_DB:-0}"}
      OpenApis: >-
        dsearchtree:{"client":true,"prefix":"dsearchtree","url":"http://dat-api:3000/openapi.json"}
      CacheConfigs: >-
        dsearchtree:{"redisDS":"redisDS","cacheTTL":6000000}
      LoggingConfigs: >-
        dsearchtree:{"loglevel":"info","httplog":true,"global":true,"group":"logging"}
      MCP_CONFIGS: '{"dat-search":{"enable":true,"defaultInclude":"GET:dsearchtree/drilldowns/vehicle,GET:dsearchtree/drilldowns/vehicle/*"}}'
    depends_on:
      dat-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/ping"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    environment:
      SVELTE_APP_API_URL: http://localhost:3334/dsearchtree
    depends_on:
      dat-api:
        condition: service_healthy
